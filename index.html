<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sasha | Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
  
  <style>
    /* Variables (Por defecto: AV) */
    :root {
      --bg-color: #0d0d0d;
      --text-color: #f2f2f2;
      --accent: #a659cf;
      --sidebar-bg: #141414;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    /* Mundo Música */
    body.mode-music {
      --bg-color: #e6e6e6;
      --text-color: #0d0d0d;
      --accent: #ff4500;
      --sidebar-bg: #d9d9d9;
      --border-color: rgba(0, 0, 0, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.5s ease, color 0.5s ease;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* --- SIDEBAR --- */
    .sidebar {
      width: 280px;
      background-color: var(--sidebar-bg);
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 1px solid var(--border-color);
      transition: background-color 0.5s ease, border-color 0.5s ease;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 15px;
      cursor: pointer;
    }

    .brand img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--text-color);
      transition: border-color 0.5s ease;
    }

    .brand h1 {
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: -100px; /* Centrado visual compensado */
    }

    .nav-links a {
      color: var(--text-color);
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0.5;
      transition: opacity 0.3s ease, color 0.3s ease;
    }

    .nav-links a:hover {
      opacity: 1;
      color: var(--accent);
    }

    /* --- SWITCH ON/OFF --- */
    .switch-wrapper {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .switch-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0.4;
      font-weight: 600;
    }

    .toggle-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 12px 20px;
      font-size: 0.85rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s ease;
      border-radius: 4px;
    }

    .toggle-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent);
      transition: background-color 0.5s ease, box-shadow 0.5s ease;
    }

    /* --- LIENZO DERECHO --- */
    .main-content {
      flex-grow: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .world {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.98);
      transition: opacity 0.6s ease, transform 0.6s ease;
      padding: 40px;
    }

    body:not(.mode-music) #world-av {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    body.mode-music #world-music {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    /* Estructura del Reel 16:9 */
    .reel-container {
      width: 100%;
      max-width: 1200px;
      aspect-ratio: 16 / 9;
      background-color: var(--sidebar-bg);
      border: 1px solid var(--border-color);
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }

    .reel-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.6;
      transition: opacity 0.3s ease;
    }

    .reel-container:hover img {
      opacity: 1;
    }

    .play-overlay {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: var(--text-color);
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 4px;
      text-transform: uppercase;
      pointer-events: none;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }

    @media (max-width: 768px) {
      body { flex-direction: column; overflow-y: auto; }
      .sidebar { width: 100%; padding: 20px; border-right: none; border-bottom: 1px solid var(--border-color); flex-direction: row; align-items: center; }
      .nav-links { flex-direction: row; margin-top: 0; display: none; /* En móvil haríamos un menú hamburguesa luego */ }
      .switch-wrapper { gap: 5px; }
      .main-content { padding: 20px; height: calc(100vh - 80px); }
      .world { padding: 20px; }
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <!-- 1. LOGO -->
    <div class="brand">
      <!-- Pon el enlace de tu foto aquí en src="..." -->
      <img src="https://via.placeholder.com/150" alt="Sasha">
      <h1>Sasha</h1>
    </div>
    
    <!-- 2. NAVEGACIÓN -->
    <nav class="nav-links">
      <a href="#bio">Bio</a>
      <a href="#contact">Contact</a>
    </nav>

    <!-- 3. SWITCH ON/OFF -->
    <div class="switch-wrapper">
      <span class="switch-label">Dimension</span>
      <button class="toggle-btn" id="toggleMode">
        <span id="btn-text">Audiovisual</span>
        <div class="status-dot"></div>
      </button>
    </div>
  </aside>

  <main class="main-content">
    
    <!-- MUNDO AV -->
    <div class="world" id="world-av">
      <div class="reel-container">
        <!-- Imagen placeholder hasta que tengas el vídeo -->
        <img src="https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?q=80&w=2000&auto=format&fit=crop" alt="Showreel Placeholder">
        <div class="play-overlay">Reel 2026</div>
      </div>
    </div>

    <!-- MUNDO MÚSICA -->
    <div class="world" id="world-music">
      <h2>Soundscape Loading...</h2>
      <!-- Aquí meteremos el diseño de la música en el siguiente paso -->
    </div>

  </main>

  <script>
    const toggleBtn = document.getElementById('toggleMode');
    const body = document.body;
    const btnText = document.getElementById('btn-text');

    toggleBtn.addEventListener('click', () => {
      body.classList.toggle('mode-music');
      
      if (body.classList.contains('mode-music')) {
        btnText.textContent = 'Música';
      } else {
        btnText.textContent = 'Audiovisual';
      }
    });
  </script>

</body>
</html>
